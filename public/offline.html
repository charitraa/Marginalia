<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Marginalia</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafaf9; color: #1c1917; padding: 2rem; text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0c0a09; color: #fafaf9; }
  }
  h1 { font-family: ui-serif, Georgia, serif; font-size: 1.75rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; opacity: .75; max-width: 32ch; }
  button {
    font: inherit; padding: .6rem 1.2rem; border-radius: .5rem;
    border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
  }
</style>
<main>
  <h1>You're offline</h1>
  <p>Pages you've already opened are still available. This one hasn't been saved yet.</p>
  <button onclick="location.reload()">Try again</button>
</main>
